
name: Build KING AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: gradle assembleDebug --stacktrace

      - name: Sign APK
        env:
          KING_KEYSTORE_B64: ${{ secrets.KING_KEYSTORE_B64 }}
          KING_KEYSTORE_PASSWORD: ${{ secrets.KING_KEYSTORE_PASSWORD }}
          KING_KEY_ALIAS: ${{ secrets.KING_KEY_ALIAS }}
        run: |
          set -e

          KEYSTORE="$RUNNER_TEMP/king.keystore"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          ALIGNED="$RUNNER_TEMP/aligned.apk"
          SIGNED="$RUNNER_TEMP/KING-AI.apk"

          echo "$KING_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"

          test -s "$KEYSTORE"
          test -s "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -f 4 "$APK" "$ALIGNED"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$KING_KEY_ALIAS" \
            --ks-pass env:KING_KEYSTORE_PASSWORD \
            --key-pass env:KING_KEYSTORE_PASSWORD \
            --out "$SIGNED" \
            "$ALIGNED"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$SIGNED"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: KING-AI-signed
          path: ${{ runner.temp }}/KING-AI.apk
          if-no-files-found: error
          

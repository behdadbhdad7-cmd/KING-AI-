
      - name: Build debug APK
        env:
          KING_KEYSTORE_PASSWORD: ${{ secrets.KING_KEYSTORE_PASSWORD }}
          KING_KEY_ALIAS: ${{ secrets.KING_KEY_ALIAS }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: gradle assembleDebug --stacktrace -PkingVersionCode=${{ github.run_number }}
        

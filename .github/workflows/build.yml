name: Build KING AI APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare fixed signing key
        env:
          KEYSTORE_B64: ${{ secrets.KING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/debug.keystore
            echo "Using signing key from GitHub Secrets"
          elif [ -f app/debug-keystore.b64 ]; then
            base64 -d app/debug-keystore.b64 > app/debug.keystore
            echo "Using fallback debug key from repository file"
          else
            echo "No fixed key found; building with a random debug key"
          fi

      - name: Build debug APK
        env:
          KING_KEYSTORE_PASSWORD: ${{ secrets.KING_KEYSTORE_PASSWORD }}
          KING_KEY_ALIAS: ${{ secrets.KING_KEY_ALIAS }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: gradle assembleDebug --stacktrace -PkingVersionCode=${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KING-AI-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          

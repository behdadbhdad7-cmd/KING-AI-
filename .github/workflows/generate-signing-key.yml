name: Generate signing key (one time)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -keystore king.keystore -storetype PKCS12 \
            -storepass "$PASS" -keypass "$PASS" -alias kingai \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=KING AI,O=KING AI,C=US"
          {
            echo "KING_KEYSTORE_PASSWORD=$PASS"
            echo "KING_KEY_ALIAS=kingai"
            echo "KING_KEYSTORE_B64=$(base64 -w 0 king.keystore)"
          } > signing-key.txt

      - name: Upload key file (kept 1 day)
        uses: actions/upload-artifact@v4
        with:
          name: signing-key
          path: signing-key.txt
          retention-days: 1
          if-no-files-found: error
